name: Chart CI

on:
  workflow_call:
    inputs: &chart_inputs
      chart-dir:
        description: "Directory holding your Chart"
        required: true
        type: string 
        default: "chart"
      chart-values:
        description: "Chart values file that will be used for the testing and scanning steps"
        required: false
        type: string 
        default: "chart/values.yaml"
      kubernetes-version:
        description: "Version of the target Kubernetes cluster the Chart will run on"
        required: false
        type: string 
        default: "1.24.2"


jobs:
  helm-build-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Extract and add Helm repositories
        run: |
          yq eval '.dependencies[] | "\(.name) \(.repository)"' ${{ inputs.chart-dir }}/Chart.yaml | \
          while read -r name repo; do
            helm repo add "$name" "$repo"
          done
          helm repo update

      - name: Install chart dependencies
        run: |
          helm dependency build ${{ inputs.chart-dir }}

      - name: Generate values schema json
        uses: losisin/helm-values-schema-json-action@v1.5.3
        with:
          input: ${{ inputs.chart-dir }}/values.yaml
          output: ${{ inputs.chart-dir }}/values.schema.json

      - name: Helm-docs
        uses: losisin/helm-docs-github-action@v1.3.3
        with:
          chart-search-root: ${{ inputs.chart-dir }}
          values-file: ${{ inputs.chart-dir }}/values.yaml
          output-file: ${{ inputs.chart-dir }}/README.md
          template-files: ${{ inputs.chart-dir }}/README.md.gotpl
          sort-values-order: file

      - name: Upload packaged Chart
        uses: actions/upload-artifact@v4
        with:
          name: packaged-chart
          path: ${{ inputs.chart-dir }}
          if-no-files-found: error
          retention-days: 1


  helm-ct-lint:
    name: Helm CT - Chart Linting
    runs-on: ubuntu-latest
    needs: helm-build-chart
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged Chart
        uses: actions/download-artifact@v4
        with:
          name: packaged-chart
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run ct lint
        run: |
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --chart-dirs ${{ inputs.chart-dir }}


  kubeconform:
    name: Kubeconform - Chart Validation
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged Chart
        uses: actions/download-artifact@v4
        with:
          name: packaged-chart
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Setup Helm plugins
        run: |
          helm plugin install https://github.com/jtyr/kubeconform-helm

      - name: Run Kubeconform check
        run: |
          helm kubeconform ${{ inputs.chart-dir }} \
            --values ${{ inputs.chart-values }} \
            --schema-location ${{ inputs.chart-dir }}/values.schema.json \
            --output json \
            --kubernetes-version ${{ inputs.kubernetes-version }} \
            --strict \
            --summary


  polaris:
    name: Polaris - Chart Scan
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged Chart
        uses: actions/download-artifact@v4
        with:
          name: packaged-chart
          path: .

      - name: Setup Polaris
        run: |
          mkdir -p .local/bin
          curl -s https://api.github.com/repos/FairwindsOps/polaris/releases/latest | \
            jq '.assets[] | select(.name=="polaris_linux_amd64.tar.gz")'.browser_download_url | \
            xargs curl -s -L | \
          tar xvz -C .local/bin polaris
          echo "$PWD/.local/bin" >> $GITHUB_PATH

      - name: Configure Polaris
        run: |
          echo "checks:" > $PWD/polaris_config.yaml
          echo "  sensitiveContainerEnvVar: warning" >> $PWD/polaris_config.yaml

      - name: Run chart-testing (polaris)
        run: |
          polaris audit \
            --config=$PWD/polaris_config.yaml \
            --only-show-failed-tests \
            --set-exit-code-below-score=80 \
            --set-exit-code-on-danger=true \
            --helm-chart ${{ inputs.chart-dir }} \
            --helm-values ${{ inputs.chart-values }} \
            --format=pretty \
            --color=true


  trivy:
    name: Trivy - Chart Vulnerability Scan
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged Chart
        uses: actions/download-artifact@v4
        with:
          name: packaged-chart
          path: .

      - name: Build Trivy Vulnerability report
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_HELM_KUBE_VERSION: ${{ inputs.kubernetes-version }}
          TRIVY_HELM_SET_FILE: ${{ inputs.chart-values }}
        with:
          scan-type: 'config'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-vuln-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-vuln-results.sarif' 

      - name: Run Trivy Vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_HELM_KUBE_VERSION: ${{ inputs.kubernetes-version }}
          TRIVY_HELM_SET_FILE: ${{ inputs.chart-values }}
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          scan-type: 'config'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'


  helm-ct-test:
    name: Helm CT - Chart Testing
    runs-on: ubuntu-latest
    needs:
      - kubeconform
      - polaris 
      - trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download chart ready for CI
        uses: actions/download-artifact@v4
        with:
          name: chart-ready-for-ci
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --chart-dirs ${{ inputs.chart-dir }} \
            --helm-extra-args "-f ${{ inputs.chart-values }}"


  helm-chart-releaser:
    needs: helm-ct-test
    name: Helm CR - Chart Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Download chart ready for CI
        uses: actions/download-artifact@v4
        with:
          name: chart-ready-for-ci
          path: .

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        
      ### DEV release specific steps ###
      - name: Add release suffix - DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          CALCULATED_SHA=-dev.$(git rev-parse --short ${{ github.sha }}) \
          yq -i '.version |= . + env(CALCULATED_SHA)' ${{ inputs.chart-dir }}/Chart.yaml
  
      - name: Run chart-releaser - DEV
        if: github.ref == 'refs/heads/dev'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
          mark_as_latest: false

      ### PROD release (tag) specific steps ###
      - name: Run chart-releaser - MAIN
        if: github.ref == 'refs/heads/main'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
          mark_as_latest: true
