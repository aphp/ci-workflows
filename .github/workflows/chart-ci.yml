---
name: Chart CI

on:
  workflow_call:
    inputs:
      chart-dir:
        description: "Directory holding your Chart"
        required: true
        type: string
        default: "chart"
      chart-values:
        description: "Chart values file that will be used for the testing and scanning steps"
        required: false
        type: string
        default: "chart/values.yaml"
      kubernetes-version:
        description: "Version of the target Kubernetes cluster the Chart will run on"
        required: false
        type: string
        default: "1.24.2"

jobs:
  helm-build-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Extract and add Helm repositories
        run: |
         yq eval -r '
            .dependencies[]
            | select(.repository != "oci://*")
            | "\(.name) \(.repository)"
            ' "${{ inputs.chart-dir }}/Chart.yaml" \
          | while read -r name repo; do
              helm repo add "$name" "$repo"
            done
          helm repo update

      - name: Install chart dependencies
        run: |
          helm dependency build ${{ inputs.chart-dir }}

      - name: Generate values schema json
        uses: losisin/helm-values-schema-json-action@v2.4.1
        with:
          working-directory: ${{ inputs.chart-dir }} 
          input: values.yaml
          output: values.schema.json

      - name: Helm-docs
        uses: losisin/helm-docs-github-action@v1.7.1
        with:
          chart-search-root: ${{ inputs.chart-dir }}
          values-file: ${{ inputs.chart-dir }}/values.yaml
          output-file: ${{ inputs.chart-dir }}/README.md
          template-files: ${{ inputs.chart-dir }}/README.md.gotpl
          sort-values-order: file

  helm-ct-lint:
    name: Helm CT - Chart Linting
    runs-on: ubuntu-latest
    needs: helm-build-chart
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run ct lint
        run: |
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --chart-dirs ${{ inputs.chart-dir }}

  kubeconform:
    name: Kubeconform - Chart Validation
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Setup Helm plugins
        run: |
          helm plugin install https://github.com/jtyr/kubeconform-helm

      - name: Run Kubeconform check
        run: |
          helm kubeconform ${{ inputs.chart-dir }} \
            --values ${{ inputs.chart-values }} \
            --schema-location ${{ inputs.chart-dir }}/values.schema.json \
            --output json \
            --kubernetes-version ${{ inputs.kubernetes-version }} \
            --strict \
            --summary

  polaris:
    name: Polaris - Chart Scan
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Polaris
        run: |
          mkdir -p .local/bin
          curl -s https://api.github.com/repos/FairwindsOps/polaris/releases/latest | \
            jq '.assets[] | select(.name=="polaris_linux_amd64.tar.gz")'.browser_download_url | \
            xargs curl -s -L | \
          tar xvz -C .local/bin polaris
          echo "$PWD/.local/bin" >> $GITHUB_PATH

      - name: Configure Polaris
        run: |
          echo "checks:" > $PWD/polaris_config.yaml
          echo "  sensitiveContainerEnvVar: warning" >> $PWD/polaris_config.yaml

      - name: Run chart-testing (polaris)
        run: |
          polaris audit \
            --config=$PWD/polaris_config.yaml \
            --only-show-failed-tests \
            --set-exit-code-below-score=80 \
            --set-exit-code-on-danger=true \
            --helm-chart ${{ inputs.chart-dir }} \
            --helm-values ${{ inputs.chart-values }} \
            --format=pretty \
            --color=true

  trivy:
    name: Trivy - Chart Vulnerability Scan
    needs: helm-ct-lint
    runs-on: ubuntu-latest
    steps:
      - name: Build Trivy Vulnerability report
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_HELM_KUBE_VERSION: ${{ inputs.kubernetes-version }}
          TRIVY_HELM_SET_FILE: ${{ inputs.chart-values }}
        with:
          scan-type: 'config'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-vuln-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-vuln-results.sarif' 

      - name: Run Trivy Vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_HELM_KUBE_VERSION: ${{ inputs.kubernetes-version }}
          TRIVY_HELM_SET_FILE: ${{ inputs.chart-values }}
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          scan-type: 'config'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  helm-ct-test:
    name: Helm CT - Chart Testing
    runs-on: ubuntu-latest
    needs:
      - kubeconform
      - polaris 
      - trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.14.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --chart-dirs ${{ inputs.chart-dir }} \
            --helm-extra-args "-f ${{ inputs.chart-values }}"

  helm-chart-releaser:
    needs: helm-ct-test
    name: Helm CR - Chart Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          # Fix for "chart-cr" action bug https://github.com/helm/chart-releaser-action/issues/171#issuecomment-2372464055
          git fetch --tags
          latest_tag=$(git tag --sort=-creatordate | head -n 1 || true)
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          version: v3.14.4

      - name: Extract and add Helm repositories
        run: |
          yq eval -r '
            .dependencies[]
            | select(.repository != "oci://*")
            | "\(.name) \(.repository)"
            ' "${{ inputs.chart-dir }}/Chart.yaml" \
          | while read -r name repo; do
              helm repo add "$name" "$repo"
            done
          helm repo update

      ### Release steps specific to `feature` branch ###
      - name: Add release suffix - SNAPSHOT
        if: github.ref != 'refs/heads/main' &&  github.ref != 'refs/heads/dev'
        run: |
          VERSION_SUFFIX="-snapshot.$(git rev-parse --short ${{ github.sha }})" \
          yq -i '.version |= . + env(VERSION_SUFFIX)' ${{ inputs.chart-dir }}/Chart.yaml

      ### Release steps specific to `dev` branch ###
      - name: Add release suffix - DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          VERSION_SUFFIX="-dev.$(git rev-parse --short ${{ github.sha }})" \
          yq -i '.version |= . + env(VERSION_SUFFIX)' ${{ inputs.chart-dir }}/Chart.yaml

      - name: Run chart-releaser - DEV or SNAPSHOT
        if: github.ref != 'refs/heads/main'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
          mark_as_latest: false

      ### Release steps 
      - name: Run chart-releaser
        if: github.ref == 'refs/heads/main'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
          mark_as_latest: true
