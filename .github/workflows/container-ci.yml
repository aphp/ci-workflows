---
name: build

on:
  workflow_call:
    inputs:
      dockerfile-path:
        description: "Path to Dockerfile of your project"
        required: false
        type: string 
        default: "Dockerfile"
      hadolint-ignore:
        description: "Comma separated list of Hadolint rules to ignore (for scan only, will still be present in the generated report)"
        required: false
        default: ''
        type: string
      image-name:
        description: "Image name"
        required: true
        type: string
      image-custom-tag:
        description: "Custom image tag, to be added to the ones generated by default"
        required: false
        default: ''
        type: string
      extra-build-args:
        description: "Extra build args as KEY=VALUE, one per line, in a YAML scalar bloc"
        required: false
        default: ''
        type: string
      dockle-ignore:
        description: "Comma separated list of Dockle rule IDs to ignore"
        required: false
        default: ''
        type: string
      dockle-accept-file:
        description: "Comma separated list of filenames to accept (Dockle accept-file)"
        required: false
        default: ''
        type: string
      dockle-accept-key:
        description: "Comma separated list of keys to accept (Dockle accept-key)"
        required: false
        default: ''
        type: string
      trivy-ignore-vuln-ids:
        description: |
          List of vulnerability IDs (CVE-..., GHSA-..., AVD-...) to ignore in Trivy.
          One per line (recommended) or comma-separated.
        required: false
        default: ''
        type: string
      trivy-ignore-license-ids:
        description: |
          List of license IDs to ignore in Trivy (ex: GPL-3.0-only, MIT, Apache-2.0 WITH LLVM-exception).
          One per line (recommended) or comma-separated.
        required: false
        default: ''
        type: string

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Hadolint report
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          no-fail: true
          no-color: true
          failure-threshold: ignore
          format: sarif
          output-file: 'hadolint-report.sarif'

      - name: Upload Hadolint report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'hadolint-report.sarif'
          category: linting

      - name: Run Hadolint scan
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          ignore: ${{ inputs.hadolint-ignore }}
          failure-threshold: warning
          format: tty


  image-build:
    name: Image Build
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
 
      - name: Parse build-args
        id: args
        shell: bash
        run: |
          {
            echo "build-args<<EOF"
            echo "GIT_PROJECT=${{ github.repository }}"
            echo "GIT_BRANCH=${{ github.ref_name }}"
            echo "GIT_COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')"
            echo "GIT_COMMIT_SHA=${{ github.sha }}"

            extra='${{ inputs.extra-build-args }}'
            if [ -n "${extra//[[:space:]]/}" ]; then
              printf '%s\n' "$extra" \
                | sed -e 's/^[[:space:]]*//' -e '/^#/d' -e '/^$/d'
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ inputs.image-name }}
          # Generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=${{ inputs.image-custom-tag }},enable=${{ inputs.image-custom-tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        # Fixes CIS-DI-0005
        env:
          DOCKER_CONTENT_TRUST: '1'
        with:
          file: ${{ inputs.dockerfile-path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.args.outputs.build-args }}
          push: false
          outputs: type=docker,dest=/tmp/container.image.${{ hashFiles(inputs.dockerfile-path) }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: container.image.${{ hashFiles(inputs.dockerfile-path) }}
          path: /tmp/container.image.${{ hashFiles(inputs.dockerfile-path) }}.tar


  image-audit:
    name: Image Audit
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download image tarball
        uses: actions/download-artifact@v8
        with:
          name: container.image.${{ hashFiles(inputs.dockerfile-path) }}
          path: /tmp

      - name: Load image
        run: |
          TARBALL="/tmp/container.image.${{ hashFiles(inputs.dockerfile-path) }}.tar"
          echo "[INFO]: Importing container image from following tarball :"
          ls -al "$TARBALL"
          docker load --input "$TARBALL"
          echo "[INFO]: The following images are now present in the local registry :"
          docker image ls -a

      - name: Generate SHORT_SHA
        id: short-sha
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Build Dockle report
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          format: sarif
          output: 'dockle-report.sarif'
          exit-code: 0

      - name: Upload Dockle report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'dockle-report.sarif'
          category: code-quality

      - name: Download Dockle
        run: |
          curl -sSL "https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-386.tar.gz" -o dockle.tar.gz
          tar -xzf dockle.tar.gz
          sudo mv dockle /usr/local/bin/dockle

      - name: Run dockle
        run: |
          dockle_keys_formater(){ IFS=', ' read -r -a keys_list <<< "$VALUES" && \
          formated_keys="" && \
          for key in ${keys_list[@]}; do formated_keys="${formated_keys} $ARG $key" ; done && \
          echo "$formated_keys " ;}

          dockle \
          $(VALUES="${{ inputs.dockle-accept-key }}" ARG="--accept-key" dockle_keys_formater) \
          $(VALUES="${{ inputs.dockle-accept-file }}" ARG="--accept-file" dockle_keys_formater) \
          $(VALUES="${{ inputs.dockle-ignore }}" ARG="--ignore" dockle_keys_formater) \
          --exit-code 1 \
          --format json \
          "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"


  image-scan:
    name: Image Scan
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download image tarball
        uses: actions/download-artifact@v8
        with:
          name: container.image.${{ hashFiles(inputs.dockerfile-path) }}
          path: /tmp

      - name: Load image
        run: |
          TARBALL="/tmp/container.image.${{ hashFiles(inputs.dockerfile-path) }}.tar"
          echo "[INFO]: Importing container image from following tarball :"
          ls -al "$TARBALL"
          docker load --input "$TARBALL"
          echo "[INFO]: The following images are now present in the local registry :"
          docker image ls -a

      - name: Generate SHORT_SHA
        id: short-sha
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Generate Trivy ignore file from inputs
        env:
          TRIVY_IGNORE_VULN_IDS: ${{ inputs.trivy-ignore-vuln-ids }}
          TRIVY_IGNORE_LICENSE_IDS: ${{ inputs.trivy-ignore-license-ids }}
        run: |
          IGNORE_FILE="ci-trivy-ignore.txt"
          echo "# Generated by reusable build workflow" > "$IGNORE_FILE"

          if [ -n "$TRIVY_IGNORE_VULN_IDS" ]; then
            echo "" >> "$IGNORE_FILE"
            echo "# Vulnerabilities" >> "$IGNORE_FILE"
            printf '%s\n' "$TRIVY_IGNORE_VULN_IDS" | tr ',' '\n' >> "$IGNORE_FILE"
          fi

          if [ -n "$TRIVY_IGNORE_LICENSE_IDS" ]; then
            echo "" >> "$IGNORE_FILE"
            echo "# Licenses" >> "$IGNORE_FILE"
            printf '%s\n' "$TRIVY_IGNORE_LICENSE_IDS" | tr ',' '\n' >> "$IGNORE_FILE"
          fi

          echo "[INFO] Generated $IGNORE_FILE:"
          cat "$IGNORE_FILE"

      - name: Generate SBOM (SPDX JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'image'
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          format: 'spdx-json'
          output: 'image-sbom.spdx.json'
          exit-code: '0'

      - name: Submit SBOM to GitHub Dependency Graph
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: 'image-sbom.spdx.json'

      - name: Build Trivy Vulnerability report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          skip-setup-trivy: true
          exit-code: '0'
          ignore-unfixed: false
          scanners: 'vuln,secret'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          limit-severities-for-sarif: 'false'
          output: 'trivy-vuln-results.sarif'

      - name: Upload Trivy Vulnerability report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-vuln-results.sarif'
          category: vulnerability

      - name: Build Trivy License report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          skip-setup-trivy: true
          exit-code: '0'
          ignore-unfixed: false
          scanners: 'license'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          limit-severities-for-sarif: 'false'
          output: 'trivy-license-results.sarif'

      - name: Upload Trivy License report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: license

      - name: Run Trivy Vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        # Overriding env vars from previous steps for them not to interfere with the scan
        env:
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          skip-setup-trivy: true
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          format: 'table'
          trivyignores: 'ci-trivy-ignore.txt'

      - name: Run Trivy License scan
        uses: aquasecurity/trivy-action@v0.35.0
        # Overriding env vars from previous steps for them not to interfere with the scan
        env:
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          skip-setup-trivy: true
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'license'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          format: 'table'
          trivyignores: 'ci-trivy-ignore.txt'

  push-docker-image:
    name: Image Push to GHCR
    needs:
      - image-audit
      - image-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Download image tarball
        uses: actions/download-artifact@v8
        with:
          name: container.image.${{ hashFiles(inputs.dockerfile-path) }}
          path: /tmp

      - name: Load image
        run: |
          TARBALL="/tmp/container.image.${{ hashFiles(inputs.dockerfile-path) }}.tar"
          echo "[INFO]: Importing container image from following tarball :"
          ls -al "$TARBALL"
          docker load --input "$TARBALL"
          echo "[INFO]: The following images are now present in the local registry :"
          docker image ls -a

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Image to GitHub Container Registry
        run: |
          docker push --all-tags ${{ inputs.image-name }}
