name: build

on:
  workflow_call:
    inputs:
      dockerfile-path:
        description: "Path to Dockerfile of your project"
        required: false
        type: string 
        default: "Dockerfile"
      ignore_hadolint_rules:
        description: "Comma separated list of Hadolint rules to ignore (for scan only, will still be present in the generated report)"
        required: false
        default: ''
        type: string
      image-name:
        description: "Image name"
        required: true
        type: string
      image-custom-tag:
        description: "Custom image tag, to be added to the ones generated by default"
        required: false
        default: ''
        type: string
      extra-build-args:
        description: "Extra build args as JSON array of objects [{'name':'ARG1','value':'val1'},...]"
        required: false
        default: '[]'
        type: string

jobs:
  hadolint:
    name: Hadolint - Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Hadolint report
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          no-fail: true
          no-color: true
          failure-threshold: ignore
          format: sarif
          output-file: 'hadolint-report.sarif'

      - name: Upload Hadolint report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'hadolint-report.sarif'
          category: linting

      - name: Run Hadolint scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          ignore: ${{ inputs.ignore_hadolint_rules }}
          failure-threshold: warning
          format: tty


  build-image:
    name: Buildx - Image Build
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ inputs.image-name }}
          # Generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=${{ inputs.image-custom-tag }},enable=${{ inputs.image-custom-tag != '' }}

      - name: Get Git metadata
        id: git_metadata
        run: |
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

      - name: Parse build-args
        id: args
        run: |

          # Setup default build-args, to be exposed to all builds
          DEFAULT_BUILD_ARGS=$(cat <<EOF
          [
            {"name": "GIT_PROJECT", "value": "${{ steps.git_metadata.outputs.repo }}"},
            {"name": "GIT_BRANCH", "value": "${{ github.ref_name }}"},
            {"name": "GIT_COMMIT_AUTHOR", "value": "${{ steps.git_metadata.outputs.author }}"},
            {"name": "GIT_COMMIT_SHA", "value": "${{ github.sha }}"}
          ]
          EOF
          )
  
          # Adding user-supplied default build-args
          echo "${{ inputs.extra-build-args }}" > args.json

          # Combining default and extra build args to a single var exposed as step output, 
          # to be reused in the build step
          BUILD_ARGS=$(jq -s 'add' <(echo "$DEFAULT_BUILD_ARGS") input-args.json)

          echo "build_args=$BUILD_ARGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        # Fixes CIS-DI-0005
        env:
          DOCKER_CONTENT_TRUST: '1'
        with:
          file: ${{ inputs.dockerfile-path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build_args: |
            ${{ steps.args.outputs.flags }}
          push: false
          outputs: type=docker,dest=/tmp/container-image.${{github.run_id}}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image.${{github.run_id}}
          path: /tmp/container-image.${{github.run_id}}.tar


  dockle:
    name: Dockle - Image Scan
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: container-image.${{github.run_id}}
          path: /tmp

      - name: Load image
        run: |
          echo "[INFO]: Importing container image from following tarball : $(ls -al /tmp/container-image.${{github.run_id}}.tar)"
          docker load --input /tmp/container-image.${{github.run_id}}.tar
          echo "[INFO]: The following images are now present in the local registry : $(docker image ls -a)"

      - name: Generate SHORT_SHA
        id: short-sha
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Build Dockle report
        uses: erzz/dockle-action@v1.4.0
        with:
          image: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          report-format: sarif
          failure-threshold: fatal
          exit-code: 0

      - name: Upload Dockle report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'dockle-report.sarif'
          category: code-quality

      - name: Run Dockle check
        uses: erzz/dockle-action@v1.4.0
        with:
          image: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          failure-threshold: fatal
          exit-code: 1

      
  trivy-vulns:
    name: Trivy - Vulnerability Scan
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: container-image.${{github.run_id}}
          path: /tmp

      - name: Load image
        run: |
          echo "[INFO]: Importing container image from following tarball : $(ls -al /tmp/container-image.${{github.run_id}}.tar)"
          docker load --input /tmp/container-image.${{github.run_id}}.tar
          echo "[INFO]: The following images are now present in the local registry : $(docker image ls -a)"

      - name: Generate SHORT_SHA
        id: short-sha
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Build Trivy Vulnerability report
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          exit-code: '0'
          ignore-unfixed: false
          scanners: 'vuln,secret'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          limit-severities-for-sarif: 'false'
          output: 'trivy-vuln-results.sarif'

      - name: Upload Trivy Vulnerability report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-vuln-results.sarif'
          category: vulnerability

      - name: Run Trivy Vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        # Overriding env vars from previous steps for them not to interfere with the scan
        env:
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          format: 'table'


  trivy-license:
    name: Trivy - License scan
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: container-image.${{github.run_id}}
          path: /tmp

      - name: Load image
        run: |
          echo "[INFO]: Importing container image from following tarball : $(ls -al /tmp/container-image.${{github.run_id}}.tar)"
          docker load --input /tmp/container-image.${{github.run_id}}.tar
          echo "[INFO]: The following images are now present in the local registry : $(docker image ls -a)"

      - name: Generate SHORT_SHA
        id: short-sha
        uses: benjlevesque/short-sha@v3.0
        with:
          length: 7

      - name: Build Trivy License report
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          exit-code: '0'
          ignore-unfixed: false
          scanners: 'license'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'sarif'
          limit-severities-for-sarif: 'false'
          output: 'trivy-license-results.sarif'

      - name: Upload Trivy License report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-license-results.sarif'
          category: license

      - name: Run Trivy License scan
        uses: aquasecurity/trivy-action@0.29.0
        # Overriding env vars from previous steps for them not to interfere with the scan
        env:
          TRIVY_FORMAT: 'table'
          TRIVY_OUTPUT: ''
        with:
          image-ref: "${{ inputs.image-name }}:sha-${{ steps.short-sha.outputs.sha }}"
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'license'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          format: 'table'


  push-docker-image:
    name: Docker - Image Push to GHCR
    needs: [dockle, trivy-vulns, trivy-license]
    runs-on: ubuntu-24.04
    
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: container-image.${{github.run_id}}
          path: /tmp

      - name: Load image
        run: |
          echo "[INFO]: Importing container image from following tarball : $(ls -al /tmp/container-image.${{github.run_id}}.tar)"
          docker load --input /tmp/container-image.${{github.run_id}}.tar
          echo "[INFO]: The following images are now present in the local registry : $(docker image ls -a)"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Image to GitHub Container Registry
        run: |
          docker push --all-tags ${{ inputs.image-name }}
